name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and application version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_version=${GITHUB_REF_NAME#v}
          app_version=$(sed -n 's/^const Current = "\([^"]*\)"/\1/p' app/version/version.go)
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match app version $app_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test release commit
        run: go test ./...

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build release package
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            "$RUNNER_TEMP/release"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearlnote-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Pearlnote $GITHUB_REF_NAME"
