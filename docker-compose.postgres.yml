services:

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: pearlnote
      POSTGRES_PASSWORD: pearlnote
      POSTGRES_DB: pearlnote
    #ports:
    #  - 127.0.0.1:5432:5432
    volumes:
      # PostgreSQL 18 stores PGDATA under 18/docker in this parent directory.
      - ./data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-pearlnote-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-pearlnote-seed.sql:ro

  pearlnote:
    build: .
    image: pearlnote:1.0.0
    container_name: pearlnote
    restart: always
    depends_on:
      - postgres
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - type: bind
        source: ./conf/app.docker-postgres.conf
        target: /opt/pearlnote/conf/app.conf
        read_only: true
        bind:
          create_host_path: false
      - ./files:/opt/pearlnote/files
      - ./public/upload:/opt/pearlnote/public/upload
